import java.util.Properties

plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Secrets : les mots de passe du keystore ne sont PLUS en clair dans ce fichier.
// Ils sont lus depuis local.properties (non versionné, voir .gitignore) ou,
// à défaut, depuis des variables d'environnement (CI).
// ---------------------------------------------------------------------------
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

def ksStoreFile = localProps.getProperty("KEYSTORE_STORE_FILE")
        ?: System.getenv("KEYSTORE_STORE_FILE") ?: "../keystore.jks"
def ksStorePassword = localProps.getProperty("KEYSTORE_STORE_PASSWORD")
        ?: System.getenv("KEYSTORE_STORE_PASSWORD") ?: ""
def ksKeyAlias = localProps.getProperty("KEYSTORE_KEY_ALIAS")
        ?: System.getenv("KEYSTORE_KEY_ALIAS") ?: "splitlauncher"
def ksKeyPassword = localProps.getProperty("KEYSTORE_KEY_PASSWORD")
        ?: System.getenv("KEYSTORE_KEY_PASSWORD") ?: ""

android {
    namespace 'com.ninja.splitlauncher'
    compileSdk 35

    defaultConfig {
        applicationId "com.ninja.splitlauncher"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.3"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile file(ksStoreFile)
            storePassword ksStorePassword
            keyAlias ksKeyAlias
            keyPassword ksKeyPassword
        }
    }

    buildTypes {
        release {
            // R8 : obfuscation + réduction du code, et suppression des ressources inutilisées.
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
        // AIDL : nécessaire pour l'interface IUserService du UserService Shizuku.
        aidl true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'

    // Shizuku : exécution de commandes shell privilégiées SANS root (préféré à su).
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Tests unitaires
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
}
